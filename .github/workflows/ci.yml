name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI is the guardrail for every later phase. A red build blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and architecture tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Playwright runs separately: it needs a browser download and a production
  # build, and Phase 0 has exactly one smoke test. Keeping it out of the main
  # job keeps fast feedback fast.
  e2e:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Non-sensitive fixtures target local Postgres and the local Responses stub.
    # CI never sends email or performs a paid OpenAI call.
    env:
      DATABASE_URL: postgresql://atlas:atlas@127.0.0.1:5432/atlas_ci
      DATABASE_ENVIRONMENT: development
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      AUTH_RESEND_KEY: re_ci_only_not_a_real_key
      AUTH_EMAIL_FROM: Atlas CI <atlas@example.com>
      OWNER_EMAIL: owner@example.com
      AUTH_URL: http://127.0.0.1:3000
      OPENAI_API_KEY: sk-ci-only-not-a-real-openai-key
      OPENAI_BASE_URL: http://127.0.0.1:4010/v1
      ATLAS_CONVERSATION_MODEL: gpt-5.6-sol
      ATLAS_BACKGROUND_MODEL: gpt-5.6-terra
      ATLAS_DAILY_SOFT_LIMIT_USD: 10
      ATLAS_MONTHLY_HARD_LIMIT_USD: 150

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Database integration tests
        run: pnpm test:integration

      - name: Seed authenticated owner session
        env:
          PGPASSWORD: atlas
        run: |
          psql -h 127.0.0.1 -U atlas -d atlas_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO owners (id, email, email_verified)
          VALUES ('00000000-0000-4000-8000-000000000001', 'owner@example.com', now())
          ON CONFLICT (email) DO UPDATE SET email_verified = EXCLUDED.email_verified;
          INSERT INTO auth_sessions (session_token, owner_id, expires)
          VALUES ('atlas-ci-owner-session', '00000000-0000-4000-8000-000000000001', now() + interval '1 hour')
          ON CONFLICT (session_token) DO UPDATE SET expires = EXCLUDED.expires;
          SQL

      - name: Run smoke test
        run: pnpm test:e2e
